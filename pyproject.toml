[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex_probe"
version = "0.1.0"
description = "Recording reverse-proxy and config-only backend swap for the OpenAI Codex CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
